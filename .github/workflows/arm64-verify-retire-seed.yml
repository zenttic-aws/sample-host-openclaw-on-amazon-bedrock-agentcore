# Throwaway fork-only workflow: builds the arm64 bridge image of
# chore/retire-shared-live-seed on a native ubuntu-24.04-arm runner, checks that
# the shared live seed is gone from the image, runs the prepared gateway with a
# chat turn against a loopback stub provider, then boot-smokes the image.
# Not for merge to the official repo.
name: arm64-verify-retire-seed

on:
  push:
    branches: [ci/arm64-verify-retire-seed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build arm64 bridge image (runs the patch-script tests and applies every patch)
        run: |
          set -o pipefail
          docker buildx build --platform linux/arm64 --provenance=false --load --progress=plain \
            --tag openclaw-bridge:smoke --file bridge/Dockerfile bridge 2>&1 | tee "$RUNNER_TEMP/build.log"
          grep -F '[patch-openclaw] OpenClaw 2026.9.5: empty subagent fact patch applied.' "$RUNNER_TEMP/build.log"
          grep -F '[patch-openclaw-preinit] OpenClaw 2026.9.5: preinit patches applied.' "$RUNNER_TEMP/build.log"
          grep -F '[patch-openclaw-snapshot] OpenClaw 2026.9.5: snapshot patches applied.' "$RUNNER_TEMP/build.log"
          grep -E 'ℹ (tests|pass|fail) ' "$RUNNER_TEMP/build.log" | head -6 || true

      - name: Node version, architecture and undici floor
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node openclaw-bridge:smoke -p 'process.version + " " + process.arch'
          test "$(docker run --rm --entrypoint node openclaw-bridge:smoke -p process.arch)" = arm64
          docker run --rm --entrypoint node openclaw-bridge:smoke /tmp/undici-floor-check.js

      - name: The shared live seed is gone from the image
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint sh openclaw-bridge:smoke -c '
            set -e
            if ls /app | grep -E "live-gateway-seed|live-seed-bridge|session-diff-worker"; then exit 1; fi
            test -f /app/gateway-activation.js
            for f in agentcore-contract gateway-activation workspace-sync state-storage; do node --check /app/$f.js; done'
          docker run --rm --network none --entrypoint node openclaw-bridge:smoke -e '
            const m = require("/app/runtime-source-manifest.json");
            const files = m.files.map((f) => f.path);
            const bad = files.filter((f) => /live-gateway-seed|live-seed-bridge|session-diff-worker/.test(f));
            const patch = require("/app/patches/runtime-v2.json");
            console.log(`manifest: openclaw ${m.openclaw}, node ${m.node}, ${files.length} pinned files, ${patch.files.length} snapshot patch files`);
            if (bad.length || m.openclaw !== "2026.9.5" || patch.files.length !== 4 ||
                !files.includes("/app/gateway-activation.js")) { console.log("unexpected", bad); process.exit(1); }'

      - name: Prepared gateway (preinit + SQLite receiver preparation), activation and chat turns (no network)
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD/.github/arm64-smoke:/smoke:ro" \
            -e NODE_COMPILE_CACHE=/app/.compile-cache --entrypoint node openclaw-bridge:smoke \
            /smoke/prepared-gateway-smoke.js 2026.9.5 | tee "$RUNNER_TEMP/prepared.log"
          grep -q '^SMOKE PASSED' "$RUNNER_TEMP/prepared.log"

      - name: read-pdf.js --self-test as the agent uid (no network)
        run: |
          set -euo pipefail
          out="$(docker run --rm --network none --user 10001:10001 --entrypoint node openclaw-bridge:smoke \
            /skills/s3-user-files/read-pdf.js --self-test)"
          echo "$out"
          echo "$out" | grep -q '^read_pdf_text self-test passed: '

      - name: Boot smoke (/ping Healthy, no network)
        run: |
          set -euo pipefail
          docker run -d --network none --name smoke openclaw-bridge:smoke
          ok=
          for i in $(seq 1 90); do
            out="$(docker exec smoke node -e 'const http=require("http");http.get("http://127.0.0.1:8080/ping",r=>{let d="";r.on("data",c=>d+=c);r.on("end",()=>process.stdout.write(d))}).on("error",e=>{process.stderr.write(String(e.message));process.exit(1)})' 2>/dev/null || true)"
            if echo "$out" | grep -q 'Healthy'; then echo "ping ok after ${i} tries: $out"; ok=1; break; fi
            sleep 2
          done
          docker logs smoke 2>&1 | grep -E 'BOOTSTRAP_READY|preparation elapsedMs|gateway_seed' || true
          if [ -z "$ok" ]; then
            echo "=== /ping never returned Healthy; container logs: ==="
            docker logs smoke || true
            docker rm -f smoke || true
            exit 1
          fi
          if docker logs smoke 2>&1 | grep -q 'gateway_seed='; then echo "unexpected gateway_seed log line"; exit 1; fi
          docker rm -f smoke

      - name: Agent uid-split smoke
        run: SMOKE_TIMEOUT=180 scripts/smoke-agent-uid-dirs.sh openclaw-bridge:smoke
